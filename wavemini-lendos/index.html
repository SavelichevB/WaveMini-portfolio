<!DOCTYPE html>
<html>
    <head>
        <title>WaveMini.ru</title>
        <link rel="stylesheet" href="./css/index.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
       <div class="root">
           <div class="main">
              <div class="dock-panel">
                <div class="dock-block-one">
                    <div class="dock-logo"></div>
                </div>
                <div class="dock-block-two">
                    <div class="dock-two-btn">
                        <a href="#news">News</a>
                        <a href="#projects">Projects</a>
                        <a href="#contact">Contact</a>
                    </div>
                </div>
              </div>
              <div class="content">
                 <div class="main-block">
                     <div class="main-icon"></div>
                     <section>
                        <h1>WaveMini</h1>
                        <span>Do more. With less.</span>
                        <button>Contact Us</button>
                     </section>
                 </div>
                 <div class="news-block">
                    <h1>News:</h1>
                    <div class="news-cards">
                        <div class="card-news">
                            <div style="background-image: url('./pictures/n_wavechatbeta.jpeg'); background-position: 0 90%;" class="news-card-img"></div>
                            <img class="card-news-icon" src="./icons/newspaper.svg" alt="NEWS">
                             <span>14.10.26</span>
                            <section>
                                <h3>Выход мессенджера в открытое бета тестирование.</h3>
                                <div>Выход WaveChat в открытое БЕТА-тестирование. <b>Можете попробовать на <a href="http://wavechat.org">wavechat.org</a></b></div>
                            </section>
                        </div>
                    </div>
                 </div>
                 <div class="projects-block">
                    <h1>Projects:</h1>
                    <div class="projects-cards">
                        <div class="card-project">
                            <div class="img-card-section">
                               <img class="img-card-project"/>
                               <img style="width: 160px;" class="img-card-project"/>
                            </div>
                            <section>
                                <h3>Name Project</h3>
                                <span>Descript small</span>
                            </section>
                            <div class="project-card-btn">
                                <button>Get</button>
                                <button>GitHub</button>
                                <button>Other</button>
                            </div>
                        </div>
                    </div>
                 </div>
                 <div class="contact-block">
                    <h1>Contact us:</h1>
                 </div>
              </div>
           </div>
       </div>
    </body>
    <script src="./js/main.js"></script>
</html>
